name: NOCHAOS image

# Imagem do CTFd com o tema nochaos: ghcr.io/nochaosio/ctfd:<versao>-nochaos e :latest.
on:
  push:
    branches: [nochaos]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('CTFd/__init__.py').read()).group(1))")
          echo "TAGS=ghcr.io/nochaosio/ctfd:${v}-nochaos,ghcr.io/nochaosio/ctfd:${v}-nochaos-${GITHUB_SHA::7},ghcr.io/nochaosio/ctfd:latest" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
